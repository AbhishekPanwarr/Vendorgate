[project]
name = "vendorgate"
version = "0.0.0"
description = "VendorGate — evidence-first vendor onboarding (Phase 0 contracts freeze)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]",
  "pydantic>=2.9",
  "pydantic-settings",
  "sqlalchemy>=2.0",
  "alembic",
  "structlog",
  "anyio",
  "python-multipart",
  "pyyaml",
  "python-stdnum>=1.20,<2",
  "phonenumbers>=8.13,<9",
  "rapidfuzz>=3.9,<4",
  "unidecode>=1.3,<2",
  "networkx>=3.4,<4",
  "pdfplumber>=0.11,<1",
  "pypdf>=5,<6",
  "pillow>=10,<12",
  "pytesseract>=0.3.13,<1",
  "anthropic>=0.40,<1",
  "reportlab>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "hypothesis",
  "httpx",
  "ruff",
  "mypy",
  "pre-commit",
  "playwright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = [
  "backend.app.domain",
  "backend.app.core",
  "backend.app.pipeline",
  "backend.app.decision",
  "backend.app.adapters",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["error"]
testpaths = ["backend/tests"]
