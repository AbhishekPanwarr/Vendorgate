name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-types:
    runs-on: ubuntu-latest
    container: {image: python:3.12-slim}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy backend/app/domain backend/app/core backend/app/pipeline backend/app/decision backend/app/adapters backend/app/matching backend/app/risk backend/app/persistence backend/app/validators backend/app/api

  unit-property-contract:
    runs-on: ubuntu-latest
    needs: lint-types
    container: {image: python:3.12-slim}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e ".[dev]"
      - run: pytest -q backend/tests/unit backend/tests/property backend/tests/contract

  api:
    runs-on: ubuntu-latest
    needs: unit-property-contract
    container: {image: python:3.12-slim}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e ".[dev]"
      - run: pytest -q backend/tests/api backend/tests/golden

  coverage:
    runs-on: ubuntu-latest
    needs: unit-property-contract
    container: {image: python:3.12-slim}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=backend/app/validators --cov=backend/app/matching --cov=backend/app/risk --cov=backend/app/decision --cov-report=term --cov-fail-under=90

  golden-update-guard:
    runs-on: ubuntu-latest
    needs: api
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'golden-update')
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q 'backend/tests/golden/fixtures/'; then
            echo "golden fixtures changed without the golden-update label"; exit 1
          fi

  frontend-build:
    runs-on: ubuntu-latest
    needs: [api, coverage]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm --prefix frontend ci || npm --prefix frontend install
      - run: npm --prefix frontend run build

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: frontend-build
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e ".[dev]"
      - run: npx playwright install --with-deps chromium || true
      - run: pytest -q backend/tests/e2e
        env: {VG_BASE_URL: ${{ secrets.VG_BASE_URL }}}
